<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>知渊 · AI 智能结构化学习空间</title>
<style>
:root{
  --brand:#FF2E4D;
  --brand-soft:#FFEDF0;
  --paper:#2E6BFF;      /* 权威文献 */
  --paper-soft:#EAF1FF;
  --note:#FF9500;       /* 个人笔记 */
  --note-soft:#FFF4E5;
  --light:#A15BFF;      /* 强调色（缺口/迁移） */
  --light-soft:#F3EBFF;
  --ok:#17B978;
  --ok-soft:#E6F8F0;
  --warn:#FF8A00;
  --bg:#F4F5F7;
  --card:#FFFFFF;
  --t1:#14161A;
  --t2:#5A616E;
  --t3:#9AA1AE;
  --line:#EDEFF2;
  --r-l:20px;
  --r-m:14px;
  --r-s:10px;
  --shadow:0 2px 14px rgba(20,22,26,.06);
  --shadow-up:0 -4px 20px rgba(20,22,26,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#0E1013;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 12px;
  color:var(--t1);
}
/* ============ 手机外壳 ============ */
.phone{
  width:390px;height:844px;
  background:var(--bg);
  border-radius:46px;
  position:relative;
  box-shadow:0 0 0 11px #1C1F24, 0 0 0 13px #33373F, 0 30px 70px rgba(0,0,0,.6);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:118px;height:30px;background:#1C1F24;border-radius:16px;z-index:999;
}
.statusbar{
  height:48px;flex:0 0 48px;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 4px;font-size:13px;font-weight:600;color:var(--t1);
  background:transparent;z-index:50;position:relative;
}
.statusbar .right{display:flex;gap:5px;align-items:center;font-size:11px}
.screen{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{width:0}
.page{display:none;padding:0 16px 24px;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用 ============ */
.h1{font-size:25px;font-weight:800;letter-spacing:-.4px;margin:6px 0 2px}
.sub{font-size:12.5px;color:var(--t3);line-height:1.5}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-title b{font-size:16px;font-weight:750;letter-spacing:-.2px}
.sec-title .more{font-size:12px;color:var(--t3)}
.card{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;font-weight:650;padding:3px 7px;border-radius:6px;white-space:nowrap;
}
.tag-paper{background:var(--paper-soft);color:var(--paper)}
.tag-note{background:var(--note-soft);color:#D97706}
.tag-light{background:var(--light-soft);color:var(--light)}
.tag-video{background:#EDE9FE;color:#6D28D9}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:#FFF3E0;color:#E07B00}
.tag-brand{background:var(--brand-soft);color:var(--brand)}
.tag-grey{background:#F1F3F6;color:var(--t2)}
.btn{
  border:none;border-radius:12px;font-size:14px;font-weight:700;
  padding:13px 18px;background:var(--brand);color:#fff;width:100%;
  cursor:pointer;transition:transform .12s,opacity .12s;font-family:inherit;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.ghost{background:#F1F3F6;color:var(--t1)}
.btn.line{background:#fff;border:1.4px solid var(--line);color:var(--t1)}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:10px;width:auto}
.btn.blue{background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;
  background:#fff;color:var(--t2);border:1.2px solid var(--line);cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.bar{height:6px;border-radius:99px;background:#F1F3F6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s cubic-bezier(.3,1,.4,1)}
.divider{height:1px;background:var(--line);margin:12px 0}
.mono{font-variant-numeric:tabular-nums}

/* 纯度堆叠条 */
.purity{display:flex;height:5px;border-radius:99px;overflow:hidden;background:#F1F3F6}
.purity i{display:block;height:100%}

/* ============ 底部 Tab ============ */
.tabbar{
  flex:0 0 78px;height:78px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:flex;align-items:flex-start;padding-top:9px;z-index:100;
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:#B6BCC7;font-size:10.5px;font-weight:650;transition:color .2s
}
.tabbar .tab svg{width:23px;height:23px}
.tabbar .tab.on{color:var(--brand)}

/* ============ 子页面（全屏推入） ============ */
.subpage{
  position:absolute;inset:0;background:var(--bg);z-index:400;
  display:none;flex-direction:column;
}
.subpage.active{display:flex;animation:slideIn .3s cubic-bezier(.25,.9,.3,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.navbar{
  flex:0 0 auto;padding:52px 16px 10px;display:flex;align-items:center;gap:10px;
  background:#fff;border-bottom:1px solid var(--line);
}
.navbar .back{font-size:22px;line-height:1;cursor:pointer;color:var(--t1);padding:2px 6px 2px 0}
.navbar b{font-size:16.5px;font-weight:750;flex:1;letter-spacing:-.2px}
.subbody{flex:1;overflow-y:auto;padding:14px 16px 28px}
.subbody::-webkit-scrollbar{width:0}

/* ============ 底部抽屉 ============ */
.mask{position:absolute;inset:0;background:rgba(10,12,16,.45);z-index:500;display:none;animation:fade .2s}
.mask.active{display:block}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:24px 24px 0 0;z-index:600;padding:8px 18px 26px;
  display:none;max-height:86%;overflow-y:auto;box-shadow:var(--shadow-up)
}
.sheet.active{display:block;animation:up .32s cubic-bezier(.22,1,.3,1)}
.sheet::-webkit-scrollbar{width:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;background:#E3E6EB;border-radius:9px;margin:4px auto 14px}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.sheet .desc{font-size:12.5px;color:var(--t3);margin:0 0 14px;line-height:1.55}

/* toast */
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(20,22,26,.92);color:#fff;padding:13px 20px;border-radius:14px;
  font-size:13.5px;font-weight:600;z-index:900;opacity:0;pointer-events:none;
  transition:all .25s;max-width:78%;text-align:center;line-height:1.5
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 列表项 */
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.li .tt{font-size:14px;font-weight:650}
.li .dd{font-size:11.5px;color:var(--t3);margin-top:2px}
.li .arrow{color:#CFD4DC;font-size:17px}

/* switch */
.sw{width:44px;height:26px;border-radius:99px;background:#E1E5EA;position:relative;cursor:pointer;transition:background .22s;flex:0 0 auto}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .22s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:21px}

/* segmented */
.seg{display:flex;background:#F1F3F6;border-radius:11px;padding:3px;gap:2px}
.seg>div{flex:1;text-align:center;font-size:12.5px;font-weight:650;padding:8px 4px;border-radius:9px;color:var(--t2);cursor:pointer;transition:.18s}
.seg>div.on{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.hint{font-size:11px;color:var(--t3);line-height:1.6;background:#FAFBFC;border-radius:10px;padding:10px 12px;border-left:3px solid var(--line)}
.innov{background:linear-gradient(135deg,#FFF6F7,#FFF);border:1px solid #FFE0E5}
.innov-badge{font-size:9.5px;font-weight:800;color:#fff;background:var(--brand);padding:2.5px 6px;border-radius:5px;letter-spacing:.3px}
@media (max-width:430px){
  body{padding:0;background:var(--bg)}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  .notch{display:none}
  .statusbar{display:none}
  .navbar{padding-top:16px}
}
</style>

/* ================== 框架 ================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1900);
}
function openSheet(html){
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#sheet').classList.add('active'); $('#mask').classList.add('active');
}
function closeSheet(){ $('#sheet').classList.remove('active'); $('#mask').classList.remove('active'); }

const stack = [];
function openSub(title, html, opts){
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'subpage active';
  el.innerHTML =
    '<div class="navbar"><div class="back" onclick="closeSub()">‹</div><b>'+title+'</b>'+(opts.right||'')+'</div>'+
    '<div class="subbody">'+html+'</div>';
  /* 只保留最顶层为 active，否则 .subpage.active 会命中下层页面，导致滚动作用在错误容器上 */
  if(stack.length) stack[stack.length-1].classList.remove('active');
  $('#subpages').appendChild(el);
  stack.push(el);
  $('#screen').scrollTop = 0;
}
function closeSub(){
  const el = stack.pop(); if(el) el.remove();
  if(stack.length){
    const top = stack[stack.length-1];
    top.classList.add('active');
    if(top.style) top.style.animation = 'none';   /* 返回时不重播入场动画 */
  }
}
/* 当前子页面 / 其滚动容器 / 其内部元素 —— 全部限定在顶层页面内查找 */
function curSub(){ return stack.length ? stack[stack.length-1] : null; }
function curBody(){ const s = curSub(); return s ? s.querySelector('.subbody') : null; }
function subQ(sel){ const s = curSub(); return s ? s.querySelector(sel) : null; }
function switchTab(name){
  $$('.tabbar .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+name).classList.add('active');
  $('#screen').scrollTop = 0;
  while(stack.length) closeSub();
}

  const tot = p.paper+p.note || 1;

function ringSVG(pct, size, stroke, color){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#F1F3F6" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+

/* 某板块的资料清单（含串行锁） */
function blockRow(f, k){
  const bm = BLOCK_META[k], items = blockItems(f,k), active = f.plan.activeBlock===k;
  const idx = f.plan.order.indexOf(k);
  const prevDone = f.plan.order.slice(0,idx).every(x=>blockDone(f,x));
  let h = '<div style="margin-top:14px">'+
    '<div class="between" style="margin-bottom:8px">'+
      '<div class="row" style="gap:6px"><span class="tag '+bm.cls+'">'+bm.ico+' '+bm.label+'板块</span>'+
      (active?'<span class="tag tag-brand">进行中</span>':blockDone(f,k)?'<span class="tag tag-ok">已完成</span>':
        prevDone?'<span class="tag tag-grey">待开始</span>':'<span class="tag tag-grey">🔒 未解锁</span>')+'</div>'+
      '<span style="font-size:10.5px;color:var(--t3)">'+(bm.seq?'逐个学完':'可穿插')+'</span></div>';
  if(!items.length){
    h += '<div style="font-size:11.5px;color:var(--t3);background:#FAFBFC;border-radius:9px;padding:10px 11px">该板块暂无资料，可上传或从文献库添加</div></div>';
    return h;
  }
  let firstUndone = true;
  items.forEach(it=>{
    const pctv = Math.round(it.done/it.total*100);
    const isDone = it.status==='done';
    const isCur = !isDone && firstUndone;
    if(!isDone && firstUndone) firstUndone = false;
    const locked = bm.seq && !isDone && !isCur;
    h += '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:11px;margin-bottom:7px;'+
      (isCur&&active?'background:'+f.color+'0D;box-shadow:inset 0 0 0 1.3px '+f.color+'44':'background:#FAFBFC')+
      (locked?';opacity:.62':'')+'" onclick="openMat(\''+it.id+'\')">'+
      '<div style="flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;'+
        (isDone?'background:var(--ok-soft);color:var(--ok)':isCur?'background:'+f.color+';color:#fff':'background:#EDEFF2;color:#9AA1AE')+'">'+
        (isDone?'✓':locked?'🔒':'▶')+'</div>'+
      '<div class="grow"><div style="font-size:12.5px;font-weight:700;line-height:1.4">'+it.title+'</div>'+
      '<div style="font-size:10px;color:var(--t3);margin-top:2px">'+it.sub+'</div>'+
      '<div class="bar" style="height:4px;margin-top:6px"><i style="width:'+pctv+'%;background:'+(isDone?'var(--ok)':f.color)+'"></i></div>'+
      '<div class="between" style="font-size:9.5px;color:var(--t3);margin-top:4px">'+
      '<span>'+it.done+' / '+it.total+' '+bm.unit+'</span>'+
      '<span>'+(isDone?'已学完':locked?'需先学完上一'+(k==='paper'?'篇':'门'):isCur?'正在学 · 每次 '+it.step+' '+bm.unit:'排队中')+'</span></div></div></div>';
  });
  h += '</div>';
  return h;
}
function openMat(id){

  openSheet(

    '<div style="display:flex;gap:6px;margin-bottom:14px">'+
      '<span class="tag '+bm.cls+'">'+bm.grade+'</span>'+
      '<span class="tag tag-grey">'+it.done+' / '+it.total+' '+bm.unit+'</span>'+
      '<span class="tag '+(it.status==='done'?'tag-ok':it.status==='learning'?'tag-brand':'tag-grey')+'">'+
        (it.status==='done'?'已学完':it.status==='learning'?'正在学':'排队中')+'</span></div>'+
    '<div class="bar" style="margin-bottom:14px"><i style="width:'+Math.round(it.done/it.total*100)+'%;background:'+m.folder.color+'"></i></div>'+

function setOrder(id, str){
  const f = F(id); f.plan.order = str.split(',');

  closeSheet(); closeSub(); openFolder(id); renderHome(); renderNotes();
  toast('顺序已更新为 '+f.plan.order.map(k=>BLOCK_META[k].label).join(' → '));
}

    '</div></div>';

  h += '<div style="display:flex;gap:9px;margin-top:4px">'+
    '<button class="btn" onclick="applyChangePlan()">确认，明天开始</button>'+
    '<button class="btn ghost" style="flex:0 0 88px" onclick="closeSub()">取消</button></div>';
  return h;
}
function applyChangePlan(){
  const f = F(CP.fid);
  /* 只冻结「这个领域」原来的推进对象，其他领域各自的线不受影响 */
  BLOCK_ORDER.forEach(k=>blockItems(f,k).forEach(it=>{
    if(it.status==='learning') it.status = it.done>0 ? 'paused' : 'queued';
  }));
  DB.mainFolder = CP.fid;                       /* 今日重点领域，仅影响图谱默认视角 */
  f.plan.activeBlock = CP.blk;
  const sel = blockItems(f,CP.blk).find(x=>x.id===CP.mat);
  if(sel && sel.status!=='done') sel.status = 'learning';
  closeSub();
  renderHome(); renderNotes();
  toast('已更新「'+f.name+'」· '+BLOCK_META[CP.blk].label+'板块<br><span style="font-size:11px;opacity:.85">历史进度已保留，明天 '+f.push+' 生效</span>');
}

const DAY_LIST = ['2026-09-16','2026-09-18','2026-09-19','2026-09-21','2026-09-22','2026-09-23'];
let GDAY = '2026-09-23';

function openGraph(id, day){
  GDAY = day || DB.today;
  openSub('知识图谱', '<div id="graphWrap">'+graphHTML(id)+'</div>');
}
function setGraphDay(id, day){ GDAY = day; const w = subQ('#graphWrap'); if(w) w.innerHTML = graphHTML(id); }

function graphHTML(id){
  const f = F(id);
  const isToday = GDAY===DB.today;
  const meta = DB.graphDays[GDAY] || {nodes:0, added:[], sum:''};
  /* 该日之前（含该日）入库的节点才显示；当日新增高亮 */
  const visible = GRAPH.nodes.filter(nd=> (NODE_DAY[nd.id]||'2026-01-01') <= GDAY );
  const vis = k => visible.some(x=>x.id===k);
  const n = k => GRAPH.nodes.find(x=>x.id===k);

  let svg = '<svg viewBox="0 0 390 400" style="width:100%;height:auto">';
  GRAPH.edges.forEach(e=>{
    if(!vis(e[0])||!vis(e[1])) return;
    const a=n(e[0]), b=n(e[1]);
    svg += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#E3E7EC" stroke-width="1.6"/>';
  });
  visible.forEach(nd=>{
    const s = ST[nd.st], isNew = NODE_DAY[nd.id]===GDAY;
    svg += '<g style="cursor:pointer" onclick="openNode('+nd.id+')">'+
      (isNew?'<circle cx="'+nd.x+'" cy="'+nd.y+'" r="'+(nd.r+5)+'" fill="none" stroke="#FF2E4D" stroke-width="1.8" stroke-dasharray="3 3"/>':'')+
      '<circle cx="'+nd.x+'" cy="'+nd.y+'" r="'+nd.r+'" fill="'+s.f+'" '+(nd.st==='gap'?'stroke="#C9CED6" stroke-width="1.6" stroke-dasharray="4 3"':'')+'/>'+
      '<text x="'+nd.x+'" y="'+(nd.y+3.5)+'" text-anchor="middle" font-size="'+(nd.r>27?10.5:9.5)+'" font-weight="700" fill="'+s.c+'" font-family="-apple-system,PingFang SC">'+nd.t+'</text></g>';
  });
  svg += '</svg>';

  let h = '';
  h += '<div class="card innov"><div class="row" style="margin-bottom:8px"><span class="innov-badge">创新</span>'+
      '<b style="font-size:13.5px">图谱按日更新，可回看任意一天</b></div>'+
      '<div style="font-size:12.5px;color:var(--t2);line-height:1.65">每天学完的内容当晚并入图谱，<b style="color:var(--t1)">当日新增节点用红色虚线圈出</b>。'+
      '节点颜色由你的输出验证结果着色，白色虚线节点是 AI 发现的<b style="color:var(--t1)">知识缺口</b>。</div></div>';

  /* 日期切换条 */
  h += '<div class="card" style="padding:12px 14px">'+
    '<div class="between" style="margin-bottom:10px">'+
      '<b style="font-size:13.5px">'+fmtDay(GDAY)+(isToday?' · 今天':'')+'</b>'+
      '<button class="btn sm ghost" onclick="openGraphCalendar(\''+id+'\')">📅 日历</button></div>'+
    '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">'+
      DAY_LIST.map(d=>'<div onclick="setGraphDay(\''+id+'\',\''+d+'\')" class="chip" style="flex:0 0 auto;font-size:11px;padding:6px 11px'+
        (d===GDAY?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+'">'+fmtDay(d).replace('2026 年 ','')+'</div>').join('')+
    '</div></div>';

  h += '<div class="card"><div class="between" style="margin-bottom:6px"><b style="font-size:14px">'+f.name+'</b>'+
      '<span style="font-size:11px;color:var(--t3)">共 '+visible.length+' 个节点 · 点击查看详情</span></div>'+svg+
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:6px;flex-wrap:wrap">'+
      Object.keys(ST).map(k=>'<span style="font-size:10.5px;color:var(--t2);font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+ST[k].f+';border:1px solid #C9CED6;margin-right:4px"></span>'+ST[k].l+'</span>').join('')+
      '<span style="font-size:10.5px;color:var(--brand);font-weight:700">⭕ 当日新增</span>'+
      '</div></div>';

  /* 当日小结 */
  h += '<div class="card"><b style="font-size:14px">'+fmtDay(GDAY)+' 学习小结</b>'+
    '<div style="margin-top:11px;font-size:12.5px;line-height:1.85;color:var(--t2)">'+
    '<div>🕸 图谱规模：<b style="color:var(--t1)">'+visible.length+'</b> 个节点</div>'+
    '<div>＋ 当日新增：'+(meta.added.length?meta.added.map(x=>'<b style="color:var(--t1)">'+x+'</b>').join('、'):'无')+'</div>'+
    '<div>📝 '+(meta.sum||'当日无学习记录')+'</div></div>'+
    (isToday?'':'<div class="hint" style="margin-top:12px">📅 这是历史快照。切回「今天」可看到最新图谱。</div>')+
    '</div>';

  h += '<div class="card"><div class="between"><div><b style="font-size:14px">发现 '+f.gap+' 个知识缺口</b>'+
      '<div style="font-size:11.5px;color:var(--t3);margin-top:3px">缺口会自动变成文献推荐与补缺任务</div></div></div>'+
      '<button class="btn" style="margin-top:13px" onclick="closeSub();openLibSub(\''+id+'\')">一键补全：看匹配文献</button></div>';
  return h;
}
function fmtDay(d){
  const p = d.split('-');
  return p[0]+' 年 '+(+p[1])+' 月 '+(+p[2])+' 日';
}
/* 历史图谱日历 */
function openGraphCalendar(id){
  id = id || DB.mainFolder;
  const first = 2;   /* 2026 年 9 月 1 日为周二 → 前面空 1 格 */
  let cells = '';
  for(let i=0;i<first-1;i++) cells += '<div></div>';
  for(let d=1; d<=30; d++){
    const key = '2026-09-'+String(d).padStart(2,'0');
    const g = DB.graphDays[key];
    const isToday = key===DB.today;
    const future = d>23;
    cells += '<div onclick="'+(g?'closeSub();openGraph(\''+id+'\',\''+key+'\')':'toast(\''+(future?'还没到这一天':'这天没有学习记录')+'\')')+'" '+
      'style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;'+
      (isToday?'background:var(--brand);color:#fff':g?'background:var(--paper-soft);color:var(--paper)':future?'background:#FAFBFC;color:#D6DBE2':'background:#F4F5F7;color:var(--t3)')+'">'+
      '<span style="font-size:12px;font-weight:'+(g?'800':'600')+'">'+d+'</span>'+
      (g?'<span style="font-size:8.5px;margin-top:1px;opacity:.9">'+g.nodes+'</span>':'')+
      '</div>';
  }
  let h = '';
  h += '<div class="card innov"><div class="row" style="margin-bottom:8px"><span class="innov-badge">创新</span>'+
    '<b style="font-size:13.5px">历史知识图谱</b></div>'+
    '<div style="font-size:12.5px;color:var(--t2);line-height:1.7">图谱不是一张会被覆盖的图，而是<b style="color:var(--t1)">一条可回溯的成长轨迹</b>。'+
    '点任意有记录的日期，就能看到那天为止你的知识结构长什么样。</div></div>';
  h += '<div class="card"><div class="between" style="margin-bottom:12px"><b style="font-size:14px">2026 年 9 月</b>'+
    '<span style="font-size:11px;color:var(--t3)">数字 = 当日图谱节点数</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px">'+
    ['一','二','三','四','五','六','日'].map(w=>'<div style="text-align:center;font-size:10px;color:var(--t3);font-weight:700">'+w+'</div>').join('')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">'+cells+'</div>'+
    '<div style="display:flex;gap:12px;justify-content:center;margin-top:13px;flex-wrap:wrap;font-size:10.5px;color:var(--t2)">'+
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--brand);margin-right:4px"></span>今天</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--paper-soft);margin-right:4px"></span>有记录</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:#F4F5F7;margin-right:4px"></span>无记录</span></div></div>';
  h += '<div class="sec-title"><b>成长轨迹</b><span class="more">节点数变化 ›</span></div>';
  const maxN = Math.max.apply(null, DAY_LIST.map(d=>DB.graphDays[d].nodes));
  h += '<div class="card"><div style="display:flex;align-items:flex-end;gap:8px;height:92px">'+
    DAY_LIST.map(d=>{
      const g=DB.graphDays[d], hgt=Math.round(g.nodes/maxN*66)+6, on=d===DB.today;
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer" onclick="closeSub();openGraph(\''+id+'\',\''+d+'\')">'+
        '<div style="font-size:10px;font-weight:800;color:'+(on?'var(--brand)':'var(--t3)')+'">'+g.nodes+'</div>'+
        '<div style="width:100%;height:'+hgt+'px;border-radius:5px;background:'+(on?'var(--brand)':'#D6DEEA')+'"></div>'+
        '<div style="font-size:9px;color:var(--t3)">'+d.slice(5).replace('-','/')+'</div></div>';
    }).join('')+'</div>'+
    '<div class="hint" style="margin-top:12px">📈 8 天从 4 个节点长到 10 个。节点数不是越多越好 —— 关键是<b>缺口在减少、薄弱在转绿</b>。</div></div>';
  openSub('历史图谱', h);
}

function openGoal(id){
  const f = F(id);
  const row = (label,val,unit,key)=>
    '<div class="between" style="padding:13px 0;border-bottom:1px solid var(--line)">'+
    '<div><div style="font-size:14px;font-weight:650">'+label+'</div>'+
    '<div style="font-size:10.5px;color:var(--t3);margin-top:2px">AI 默认值已按你的历史速度算好</div></div>'+
    '<div class="row" style="gap:12px">'+
    '<div onclick="tuneGoal(\''+id+'\',\''+key+'\',-1)" style="width:28px;height:28px;border-radius:8px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer">−</div>'+
    '<b class="mono" style="font-size:15px;min-width:34px;text-align:center" id="g-'+key+'">'+val+'</b>'+
    '<div onclick="tuneGoal(\''+id+'\',\''+key+'\',1)" style="width:28px;height:28px;border-radius:8px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer">＋</div>'+
    '<span style="font-size:11px;color:var(--t3);min-width:26px">'+unit+'</span></div></div>';
  openSheet(
    '<h3>每日学习要求</h3><p class="desc">默认值优先：你可以一个都不设，AI 会替你定。改动后压力平衡系统会重算整体天数。</p>'+
    '<div id="goalBox">'+row('每天学几页',f.goal.pages,'页','pages')+row('每天学几个知识点',f.goal.points,'个','points')+row('每天学习时长',f.goal.minutes,'分钟','minutes')+'</div>'+
    '<div id="goalCalc" class="hint" style="margin-top:14px"></div>'+
    '<button class="btn" style="margin-top:14px" onclick="closeSheet();toast(\'已保存 · 计划已重算\')">保存</button>'
  );
  calcGoal(id);
}
function tuneGoal(id,key,d){
  const f = F(id);
  const min = {pages:1,points:1,minutes:5}[key], step = key==='minutes'?5:1;
  f.goal[key] = Math.max(min, f.goal[key] + d*step);
  $('#g-'+key).textContent = f.goal[key];
  calcGoal(id);
}
function calcGoal(id){
  const f = F(id), tot = matTot(f);
  const pts = Math.ceil(tot*3.2), days = Math.ceil(pts/f.goal.points);
  let warn = '';
  if(f.goal.minutes >= 60) warn = '<br>⚠️ 超过 60 分钟，历史数据显示你的完成率会降到 40%，建议回调。';
  $('#goalCalc').innerHTML = '⚖️ 按当前设置：'+pts+' 个知识点 ≈ <b>'+days+' 天</b>学完，每天约 '+f.goal.minutes+' 分钟。'+warn;
}

};
let ND = {name:'', idx:0, done:[false,false,false], items:{paper:[],note:[],video:[]}};

function openNewDomain(exploreId){
  ND = {name:'', idx:0, done:[false,false,false], items:{paper:[],note:[],video:[]}, from:null};
  if(exploreId){
    const e = EXPLORE.find(x=>x.id===exploreId);
    if(e){
      ND.name = e.name; ND.from = e;
      const put = (arr, blk, tag) => (arr||[]).forEach(x=>ND.items[blk].push(
        {title:x[0], sub:x[1]+' · '+tag, total:x[2], preset:true}));
      put(e.papers,'paper','AI 已内嵌');
      put(e.videos,'video','AI 已内嵌');
      put(e.notes,'note','AI 已内嵌');
      ND.done = [false,false,true];
      ND.idx = 0;   /* 先展示已内嵌的文献，用户可继续补笔记 */
    }
  }
  openSub('新建知识领域', '<div id="ndWrap">'+ndHTML()+'</div>');
}
function ndRedraw(){ const w = subQ('#ndWrap'); if(w) w.innerHTML = ndHTML() }
function ndSetName(n){ ND.name = n; ndRedraw() }
function ndGo(i){ ND.idx = i; ndRedraw() }
function ndNext(){
  ND.done[ND.idx] = true;
  const next = ND.idx + 1;
  if(next < BLOCK_ORDER.length){ ND.idx = next; ndRedraw(); toast('已完成「'+BLOCK_META[BLOCK_ORDER[ND.idx-1]].label+'」，继续填下一方面'); }
  else { ND.idx = -1; ndRedraw(); toast('三个方面都填完了，可以生成领域卡片了'); }
}
function ndAdd(blk, kind){
  const presets = {
    paper:[['深入理解'+(ND.name||'该领域')+'（导读版）','内置文献库 · 入门',16],
           [(ND.name||'该领域')+'核心综述 2024','期刊综述 · 进阶',24],
           [(ND.name||'该领域')+'经典教材选章','教材级 · 进阶',31]],
    note:[['我的课堂随记','手写拍照 · 3 页',3],
          ['大白话理解整理','我自己写的文字',2],
          ['截图剪藏 · 来自小红书','图 2 张 · 已打来源标',2],
          ['截图剪藏 · 来自知乎高赞','图 1 张 · 已打来源标',1]],

           ['实操演示课','本地视频 · 共 48 分钟',48]]

  ndRedraw();
  toast('已添加：'+pick[0]);
}

    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">'+
      ND_PRESETS.map(t=>'<span class="chip" style="'+(ND.name===t?'background:var(--t1);color:#fff;border-color:var(--t1)':'')+'" onclick="ndSetName(\''+t+'\')">'+t+'</span>').join('')+
    '</div></div>';

  /* ② 三个方面 */
  h += '<div class="sec-title"><b>② 逐个方面添加内容</b><span class="more">填完一方面再填下一方面</span></div>';
  h += '<div class="card" style="padding:14px 16px">'+
    '<div style="display:flex;align-items:center;gap:0;margin-bottom:4px">'+
    BLOCK_ORDER.map((k,i)=>{
      const bm = BLOCK_META[k], on = ND.idx===i, fin = ND.done[i] || ND.items[k].length>0;
      return (i?'<div style="flex:0 0 14px;height:2px;background:'+(fin?'var(--ok)':'#E3E7EC')+'"></div>':'')+
        '<div onclick="ndGo('+i+')" style="flex:1;cursor:pointer;text-align:center">'+
        '<div style="width:32px;height:32px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;'+
          (on?'background:var(--brand);color:#fff':fin?'background:var(--ok-soft);color:var(--ok)':'background:#F1F3F6;color:#B6BCC7')+'">'+
          (fin&&!on?'✓':bm.ico)+'</div>'+
        '<div style="font-size:11.5px;font-weight:'+(on?'800':'650')+';margin-top:5px;color:'+(on?'var(--t1)':'var(--t3)')+'">'+bm.label+'</div>'+
        '<div style="font-size:9.5px;color:var(--t3);margin-top:1px">'+ND.items[k].length+' 项</div></div>';
    }).join('')+'</div></div>';

  if(ND.idx>=0){
    const blk = BLOCK_ORDER[ND.idx], bm = BLOCK_META[blk], items = ND.items[blk];
    h += '<div class="card">'+
      '<div class="between" style="margin-bottom:4px">'+
        '<b style="font-size:14px">'+bm.ico+' 添加'+bm.label+'</b>'+
        '<span class="tag '+bm.cls+'">'+bm.grade+'</span></div>'+
      '<div style="font-size:11.5px;color:var(--t3);line-height:1.6;margin-bottom:12px">'+
        (blk==='paper'?'文献用来搭骨架，建议至少 1 篇。之后会逐篇串行学习。'
        :blk==='note'?'笔记什么都能装：手写页、你敲的文字、从小红书 / 微博 / 知乎剪下来的截图。'
        :'视频用来做直观补强，字幕会被转写并按讲解切章，知识点绑定时间码。')+'</div>'+
      /* 添加来源 */
      '<div style="display:flex;flex-direction:column;gap:8px">'+
      ND_SOURCES[blk].map(o=>'<div onclick="ndAdd(\''+blk+'\',\''+o[1]+'\')" style="display:flex;gap:11px;align-items:center;background:#FAFBFC;border:1.2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer">'+
        '<div style="flex:0 0 auto;font-size:18px">'+o[0]+'</div>'+
        '<div class="grow"><div style="font-size:13px;font-weight:700">'+o[1]+'</div>'+
        '<div style="font-size:10.5px;color:var(--t3);margin-top:2px">'+o[2]+'</div></div>'+
        '<div style="color:var(--brand);font-size:17px;font-weight:700">＋</div></div>').join('')+
      '</div>'+
      /* 已添加清单 */
      (items.length?'<div style="margin-top:14px">'+
        '<div style="font-size:11px;font-weight:750;color:var(--t2);margin-bottom:8px">已添加 '+items.length+' 项</div>'+
        items.map((it,i)=>'<div class="between" style="background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:7px">'+
          '<div class="grow" style="padding-right:8px"><div style="font-size:12.5px;font-weight:700;line-height:1.4">'+it.title+
          (it.preset?' <span class="tag tag-paper" style="font-size:8.5px">已内嵌</span>':'')+'</div>'+
          '<div style="font-size:10px;color:var(--t3);margin-top:2px">'+it.sub+' · '+it.total+' '+bm.unit+'</div></div>'+
          '<div onclick="ndDel(\''+blk+'\','+i+')" style="flex:0 0 auto;font-size:12px;color:var(--t3);cursor:pointer">删除</div></div>').join('')+
        '</div>':'<div style="margin-top:13px;font-size:11.5px;color:var(--t3);text-align:center;padding:14px 0;background:#FAFBFC;border-radius:11px">这一方面还没有内容，可以留空跳过</div>')+
      '<div style="display:flex;gap:9px;margin-top:14px">'+
        '<button class="btn sm" style="flex:1" onclick="ndNext()">'+
          (ND.idx<BLOCK_ORDER.length-1?'这方面填好了，填下一方面（'+BLOCK_META[BLOCK_ORDER[ND.idx+1]].label+'）›':'三方面都填好了 ✓')+'</button>'+
      '</div></div>';
  }else{
    /* 汇总预览 */
    h += '<div class="card" style="background:#FAFBFC"><b style="font-size:14px">内容汇总</b>'+
      '<div style="margin-top:12px">'+BLOCK_ORDER.map(k=>{
        const bm=BLOCK_META[k];
        return '<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)">'+
          '<span style="font-size:12.5px;font-weight:650">'+bm.ico+' '+bm.label+'</span>'+
          '<span style="font-size:12px;color:var(--t2)">'+ND.items[k].length+' 项 · '+
          ND.items[k].reduce((n,x)=>n+x.total,0)+' '+bm.unit+'</span></div>';
      }).join('')+'</div>'+
      '<div class="hint" style="margin-top:12px">生成后 AI 会按 <b>文献 → 笔记 → 视频</b> 排好串行顺序，文献与视频逐个学完再开下一个；并自动排好每日推送与复习节点。</div>'+
      '<button class="btn sm ghost" style="width:100%;margin-top:12px" onclick="ndGo(0)">返回修改内容</button></div>';
  }

  /* ③ 生成 */
  h += '<div class="card" style="padding:14px 16px">'+
    '<div class="between" style="margin-bottom:10px"><b style="font-size:14px">③ 生成领域卡片</b>'+
    (ready?'<span class="tag tag-ok">可以生成</span>':'<span class="tag tag-grey">还需填名称和至少 1 项内容</span>')+'</div>'+
    '<div style="font-size:11.5px;color:var(--t3);line-height:1.6;margin-bottom:12px">点击后会在「我的知识领域」里出现一张新卡片，并立刻进入明日学习计划。</div>'+
    '<button class="btn" '+(ready?'':'style="opacity:.45"')+' onclick="'+(ready?'ndCreate()':'toast(\'请先填写名称，并至少添加 1 项内容\')')+'">＋ 新建知识领域</button></div>';
  return h;
}
function ndCreate(){
  const idx = DB.folders.length % ND_EMOJI.length;
  const pi = ND_PRESETS.indexOf(ND.name);
  const fid = 'nd'+Date.now().toString().slice(-5);
  const mk = (arr, step) => arr.map((x,i)=>({
    id:fid+'-'+i, title:x.title, sub:x.sub, total:x.total, done:0, step:step,
    status:i===0?'learning':'queued'
  }));
  const firstBlock = BLOCK_ORDER.find(k=>ND.items[k].length) || 'paper';
  const f = {
    id:fid, name:ND.name.trim(), emoji:ND_EMOJI[pi>=0?pi:idx], color:ND_COLORS[pi>=0?pi:idx],
    push:'20:00', goal:{pages:6, points:2, minutes:20},
    progress:0, streak:0, debt:0,
    load: (ND.items.paper.length? 'balanced':'too-few'),
    loadMsg: ND.items.paper.length
      ? '新建领域已按「每天 2 个知识点」拆分，首日从第 1 项开始'
      : '暂无权威文献，AI 已准备补推入门读物帮你立骨架',
    mastered:0, weak:0, gap:0,
    plan:{ order:['paper','note','video'], activeBlock:firstBlock },
    mats:{ paper:mk(ND.items.paper,5), note:mk(ND.items.note,2), video:mk(ND.items.video,15) }
  };
  /* 只让第一项处于 learning，其余排队 */
  BLOCK_ORDER.forEach(k=>f.mats[k].forEach((it,i)=>{ it.status = (k===firstBlock && i===0) ? 'learning' : 'queued'; }));
  DB.folders.push(f);
  closeSub();
  renderNotes(); renderHome(); renderLib();
  toast('已创建「'+f.name+'」<br><span style="font-size:11px;opacity:.85">'+matTot(f)+' 项内容已排入队列，明天 '+f.push+' 开始推送</span>');
}
function openBadCase(){
  openSheet(
    '<h3>反馈这条不准</h3><p class="desc">你的每一次标记都会用于修正提取模型，并立刻从你的计划里移除该内容。</p>'+
    '<div>'+['知识点提取不准 / 断错了','通俗化转译说错了意思','纯度等级判错了','这个计划量不合理','复习节点排得太密/太疏']
      .map(t=>'<div class="li" onclick="closeSheet();toast(\'已提交 · 该内容已从计划中移除\')"><div class="ico" style="background:#FFF0F2">⚑</div><div class="grow"><div class="tt">'+t+'</div></div><div class="arrow">›</div></div>').join('')+'</div>'
  );
}
</script>
<script>
/* ==== 07-library-profile.js ==== */
/* 07-library-profile.js
   文献推荐（含搜索）/ 笔记页 / 个人中心 / 设置 / 创新点清单

/* ==== 07-library-profile.js ==== */
/* 07-library-profile.js
   文献推荐（含搜索）/ 笔记页 / 个人中心 / 设置 / 创新点清单
   —— 知渊 AI 学习空间原型 · 源码模块 */

/* ================== 文献推荐（Tab 页 + 领域内子页共用） ================== */
let libFilter = {level:'全部', only:'', q:'', folder:''};

function recCard(r, opts){
  opts = opts || {};
  const f = F(r.folder);
  const lv = r.level==='入门'?'tag-ok':r.level==='进阶'?'tag-paper':'tag-light';
  return '<div class="card">'+
    '<div class="between" style="align-items:flex-start">'+
      '<div class="grow" style="padding-right:10px">'+
        '<div style="font-size:15px;font-weight:750;line-height:1.4">'+r.title+'</div>'+
        '<div style="font-size:11.5px;color:var(--t3);margin-top:4px">'+r.author+' · '+r.cite+'</div></div>'+
      '<div style="text-align:center;flex:0 0 auto">'+
        '<div style="font-size:17px;font-weight:800;color:var(--brand)">'+r.match+'</div>'+
        '<div style="font-size:9.5px;color:var(--t3)">匹配度</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">'+
      '<span class="tag '+lv+'">'+r.level+'</span>'+
      '<span class="tag tag-paper">📄 文献板块</span>'+
      (opts.hideFolder?'':'<span class="tag tag-grey">'+f.emoji+' '+f.name+'</span>')+
      (r.inLib?'<span class="tag tag-ok">✓ 已在库</span>':'')+
      (r.gap?'<span class="tag tag-brand">🧩 补缺口</span>':'')+
      (r.balance?'<span class="tag tag-warn">⚖️ 垫台阶</span>':'')+
      (r.conflictFix?'<span class="tag tag-warn">⚠️ 纠偏用</span>':'')+
    '</div>'+
    '<div style="margin-top:11px;font-size:11.5px;color:var(--t2);background:#FAFBFC;border-radius:9px;padding:9px 11px;line-height:1.55">'+
      '<b style="color:var(--t1)">为什么推给你：</b>'+r.why+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      (r.inLib
        ? '<button class="btn sm ghost" style="flex:1" onclick="toast(\'该文献已在「'+f.name+'」的文献板块中\')">已加入 '+f.name+'</button>'
        : (opts.folderId
            ? '<button class="btn sm" style="flex:1" onclick="doImport(\''+r.id+'\',\''+opts.folderId+'\')">加入本领域文献板块</button>'
            : '<button class="btn sm" style="flex:1" onclick="importRec(\''+r.id+'\')">一键导入领域</button>'))+
      '<button class="btn sm line" style="flex:0 0 74px" onclick="toast(\'已生成 5 句话摘要\')">先试读</button></div>'+
  '</div>';
}

function libMatch(r, q){
  if(!q) return true;
  const f = F(r.folder);
  const hay = (r.title+' '+r.author+' '+r.why+' '+r.level+' '+r.cite+' '+(f?f.name:'')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>-1);
}
function libList(){
  let list = DB.recs.slice();
  if(libFilter.q) list = list.filter(r=>libMatch(r, libFilter.q));
  if(libFilter.folder) list = list.filter(r=>r.folder===libFilter.folder);
  if(libFilter.level!=='全部') list = list.filter(r=>r.level===libFilter.level);
  if(libFilter.only==='gap') list = list.filter(r=>r.gap);
  if(libFilter.only==='balance') list = list.filter(r=>r.balance);
  list.sort((a,b)=>b.match-a.match);
  return list;
}
function renderLib(){
  let h = '';
  h += '<div style="padding-top:6px"><div class="h1">文献推荐</div>'+
      '<div class="sub">搜索全库文献，或看 AI 按你的进度推荐</div></div>';

  /* 搜索框 */
  h += '<div style="position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;margin-top:4px">'+
    '<div style="display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:11px 13px;box-shadow:var(--shadow)">'+
      '<span style="font-size:15px;color:var(--t3)">🔍</span>'+
      '<input id="libQ" type="search" placeholder="搜索文献 / 作者 / 领域，如：注意力、KANO、营养" '+
        'value="'+(libFilter.q||'').replace(/"/g,'&quot;')+'" oninput="libSearch(this.value)" '+
        'style="flex:1;min-width:0;border:none;outline:none;font-size:13.5px;font-family:inherit;color:var(--t1);background:transparent">'+
      (libFilter.q?'<span onclick="libSearch(\'\')" style="font-size:13px;color:var(--t3);cursor:pointer">✕</span>':'')+
    '</div>'+
    /* 领域筛选 */
    '<div style="display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px">'+
      '<div class="chip" style="flex:0 0 auto'+(!libFilter.folder?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+'" onclick="libFolder(\'\')">全部领域</div>'+
      DB.folders.map(f=>'<div class="chip" style="flex:0 0 auto'+(libFilter.folder===f.id?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+
        '" onclick="libFolder(\''+f.id+'\')">'+f.emoji+' '+f.name+'</div>').join('')+
    '</div>'+
    /* 难度 / 特殊筛选 */
    '<div style="display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px">'+
      ['全部','入门','进阶','高阶'].map(l=>'<div class="chip" style="flex:0 0 auto'+(libFilter.level===l&&!libFilter.only?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+
        '" onclick="setLibLevel(\''+l+'\')">'+l+'</div>').join('')+
      '<div class="chip" style="flex:0 0 auto'+(libFilter.only==='gap'?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+'" onclick="setLibOnly(\'gap\')">🧩 缺口补全 '+DB.recs.filter(r=>r.gap).length+'</div>'+
      '<div class="chip" style="flex:0 0 auto'+(libFilter.only==='balance'?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+'" onclick="setLibOnly(\'balance\')">⚖️ 垫台阶 '+DB.recs.filter(r=>r.balance).length+'</div>'+
    '</div></div>';

  /* 热门搜索 */
  if(!libFilter.q){
    h += '<div style="margin-bottom:12px">'+
      '<div style="font-size:10.5px;font-weight:750;color:var(--t3);margin-bottom:7px">试试搜这些</div>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap">'+
      ['注意力','KANO','蛋白质','位置编码','用户体验','膳食指南','综述'].map(k=>
        '<span class="chip" style="font-size:11.5px" onclick="libSearch(\''+k+'\')">'+k+'</span>').join('')+
      '</div></div>';
  }

  /* 推荐逻辑说明（仅在无搜索词时展示） */
  if(!libFilter.q){
    h += '<div class="card innov">'+
      '<div class="row" style="margin-bottom:9px"><span class="innov-badge">创新</span><b style="font-size:13.5px">学习进度适配，不推太难也不推太浅</b></div>'+
      '<div style="font-size:12px;color:var(--t2);line-height:1.7">'+
      '推荐三条依据同时生效：<br>① <b style="color:var(--t1)">已掌握知识点</b> → 决定难度台阶<br>'+
      '② <b style="color:var(--t1)">知识图谱缺口</b> → 主动补齐你不知道自己缺的<br>'+
      '③ <b style="color:var(--t1)">压力平衡结果</b> → 资料太少的领域优先补量</div></div>';
  }

  h += '<div id="libResults">'+libResultsHTML()+'</div>';
  $('#page-lib').innerHTML = h;
}
function libResultsHTML(){
  const list = libList();
  let h = '';
  h += '<div class="between" style="margin:2px 0 10px">'+
    '<b style="font-size:13px">'+(libFilter.q?'搜索结果':'为你推荐')+' '+list.length+' 篇</b>'+
    (libFilter.q?'<span style="font-size:11px;color:var(--t3)">关键词「'+libFilter.q+'」</span>':'<span style="font-size:11px;color:var(--t3)">按匹配度排序</span>')+'</div>';
  if(!list.length){
    h += '<div class="card" style="text-align:center;padding:34px 16px">'+
      '<div style="font-size:26px">🔍</div>'+

      '<div style="font-size:11.5px;color:var(--t3);margin-top:5px;line-height:1.6">换个关键词，或让 AI 去外部文献库找<br>找到后会直接排进对应领域的文献板块</div>'+
      '<button class="btn sm" style="width:100%;margin-top:13px" onclick="toast(\'已提交检索请求，AI 正在外部库查找\')">让 AI 去外部库找</button></div>';
  }else{

}
function libRedrawResults(){ const el = $('#libResults'); if(el) el.innerHTML = libResultsHTML(); }
function libSearch(v){

  /* 有搜索词时只重绘结果区，避免输入框失焦 */

}
function libFolder(fid){ libFilter.folder = fid; renderLib(); }
function setLibLevel(l){ libFilter.level=l; libFilter.only=''; renderLib(); }
function setLibOnly(k){ libFilter.level='全部'; libFilter.only = libFilter.only===k?'':k; renderLib(); }

/* 领域内打开文献推荐：作为子页面推入，左上角返回即回到该领域 */
let LIBSUB = {fid:null, level:'全部'};
function openLibSub(id){

}
function libSubLevel(l){ LIBSUB.level=l; const w=subQ('#libSubWrap'); if(w) w.innerHTML=libSubHTML(); }
function libSubHTML(){
  const f = F(LIBSUB.fid);

    '<div class="row"><div style="width:40px;height:40px;border-radius:12px;background:'+f.color+'14;display:flex;align-items:center;justify-content:center;font-size:19px">'+f.emoji+'</div>'+
    '<div class="grow"><div style="font-size:14.5px;font-weight:780">'+f.name+' · 内置文献库</div>'+
    '<div style="font-size:11px;color:var(--t3);margin-top:3px">已为该领域筛出 '+all.length+' 篇 · '+all.filter(r=>r.inLib).length+' 篇已在库</div></div></div>'+
    '<div class="hint" style="margin-top:12px">← 左上角返回即回到「'+f.name+'」，当前浏览位置不会丢。</div></div>';

  h += '<div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px">'+
    ['全部','入门','进阶','高阶'].map(l=>'<div class="chip" style="flex:0 0 auto'+
      (LIBSUB.level===l?';background:var(--t1);color:#fff;border-color:var(--t1)':'')+'" onclick="libSubLevel(\''+l+'\')">'+l+'</div>').join('')+

function radar(){
  const dims = [['输入广度',.82],['结构化',.9],['复述输出',.86],['坚持度',.64],['长文耐受',.39],['复习执行',.71]];
  const cx=155,cy=125,R=88;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/dims.length;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  let s = '<svg viewBox="0 0 310 250" style="width:100%;height:auto">';
  [1,.75,.5,.25].forEach(k=>{
    const p = dims.map((d,i)=>pt(i,R*k).join(',')).join(' ');
    s += '<polygon points="'+p+'" fill="none" stroke="#EDEFF2" stroke-width="1"/>';
  });
  dims.forEach((d,i)=>{const e=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#EDEFF2"/>';});
  const poly = dims.map((d,i)=>pt(i,R*d[1]).join(',')).join(' ');
  s += '<polygon points="'+poly+'" fill="rgba(255,46,77,.18)" stroke="#FF2E4D" stroke-width="2"/>';
  dims.forEach((d,i)=>{const p=pt(i,R*d[1]); s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#FF2E4D"/>';});
  dims.forEach((d,i)=>{
    const p=pt(i,R+22);
    const anchor = Math.abs(p[0]-cx)<6?'middle':(p[0]>cx?'start':'end');
    s += '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="'+anchor+'" font-size="10.5" font-weight="650" fill="'+(d[1]<.5?'#FF8A00':'#5A616E')+'" font-family="-apple-system,PingFang SC">'+d[0]+'</text>';
  });
  s += '</svg>';
  return s;
}

  const nb = NOTEBOOKS[k], f = F(nb.folder), list = NB_ENTRIES[k] || [];
  let h = '';
  /* 封面 */
  h += '<div class="card" style="padding:0;overflow:hidden">'+
    '<div style="display:flex">'+
      '<div style="flex:0 0 62px;background:linear-gradient(160deg,'+nb.color+','+nb.color+'CC);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 0;color:#fff">'+
        '<div style="font-size:23px">'+nb.emoji+'</div>'+
        '<div style="font-size:9px;font-weight:700;margin-top:7px;opacity:.9;writing-mode:vertical-rl;letter-spacing:1px">我的笔记本</div></div>'+
      '<div class="grow" style="padding:15px 15px">'+
        '<div style="font-size:16px;font-weight:800;letter-spacing:-.2px">'+nb.name+'</div>'+
        '<div style="font-size:11.5px;color:var(--t3);margin-top:4px;line-height:1.5">'+nb.desc+'</div>'+
        '<div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">'+
          '<span class="tag tag-grey">'+f.emoji+' '+f.name+'</span>'+
          '<span class="tag tag-note">'+nb.pages+' 页</span>'+
          (nb.conflict?'<span class="tag tag-warn">⚠️ '+nb.conflict+' 处冲突</span>':'<span class="tag tag-ok">✓ 无冲突</span>')+
        '</div></div></div>'+
    '<div class="between" style="padding:11px 15px;border-top:1px solid var(--line);background:#FAFBFC">'+
      '<span style="font-size:10.5px;color:var(--t3)">建于 '+nb.start+' · 最近更新 '+nb.last+'</span>'+
      '<span style="font-size:10.5px;color:var(--t2);font-weight:650">共 '+list.length+' 条 · 已萃取 '+nb.points+' 个知识点</span></div>'+
  '</div>';

  /* 说明 */
  h += '<div class="hint">📓 笔记本什么都能装：<b>手写页、我自己敲的文字、从小红书 / 微博 / 知乎 / 公众号 / 资讯站剪下来的截图</b>。'+
    '所有内容统一进入<b>笔记板块</b>，权重低于文献；凡是能被判真假的结论，都会和文献核对后再决定是否进入学习计划。</div>';

  /* 条目流 */
  list.forEach(e=>{
    const sb = SRC_BADGE[e.src];
    const warn = e.note && e.note.indexOf('⚠️')===0, pause = e.note && e.note.indexOf('⏸')===0;
    h += '<div class="card" style="padding:0;overflow:hidden;cursor:pointer" onclick="'+
      (e.conflict?'openConflict()':e.open==='note'?'openSrcNote(\'n1\')':'openNBEntry(\''+k+'\',\''+e.id+'\')')+'">'+
      /* 条目头 */
      '<div class="between" style="padding:12px 14px 10px">'+
        '<div class="row" style="gap:7px">'+
          '<span class="tag" style="background:'+sb.bg+';color:'+sb.c+'">'+sb.ico+' '+sb.n+'</span>'+
          '<span class="tag tag-note">'+(e.kind==='hand'?'✏️ 手写':e.kind==='text'?'⌨️ 文字':'🖼 截图')+'</span></div>'+
        '<span style="font-size:10px;color:var(--t3)">'+e.time+'</span></div>'+
      '<div style="padding:0 14px 12px">'+
        '<div style="font-size:14px;font-weight:750;line-height:1.4">'+e.title+'</div>'+
        /* 正文 / 截图 */
        (e.body?'<div style="font-size:12.5px;color:var(--t2);line-height:1.75;margin-top:7px">'+e.body+'</div>':'')+
        (e.cap?'<div style="font-size:12px;color:var(--t2);line-height:1.7;margin-top:7px;padding-left:9px;border-left:2px solid '+sb.c+'44">'+e.cap+'</div>':'')+
        (e.shot?'<div style="display:flex;gap:7px;margin-top:10px">'+
          e.shot.map(ss=>'<div style="flex:1;aspect-ratio:4/3;border-radius:9px;background:linear-gradient(140deg,#EEF1F5,#E2E7EE);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden">'+
            '<div style="position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:700;color:'+sb.c+';background:'+sb.bg+';padding:1.5px 5px;border-radius:4px">'+sb.n+'截图</div>'+
            '<span style="font-size:16px;opacity:.5">🖼</span>'+
            '<span style="font-size:9px;color:var(--t3);font-weight:600;text-align:center;padding:0 6px;line-height:1.3">'+ss+'</span></div>').join('')+
          '</div>':'')+
        /* 核对结论 */
        (e.note?'<div style="margin-top:10px;font-size:10.5px;line-height:1.6;border-radius:8px;padding:8px 10px;'+
          (warn?'background:#FFF3E0;color:#8A5A00':pause?'background:#F1F3F6;color:var(--t2)':'background:var(--ok-soft);color:#0E8A57')+'">'+e.note+'</div>':'')+
        '<div class="between" style="margin-top:11px">'+
          '<span style="font-size:10.5px;color:var(--t3)">已萃取 '+e.pts+' 个知识点</span>'+
          '<span style="font-size:11px;color:var(--brand);font-weight:700">'+(e.conflict?'去裁决 ›':'查看详情 ›')+'</span></div>'+
      '</div></div>';
  });

  /* 添加内容 */
  h += '<div class="card" style="padding:14px 16px">'+
    '<b style="font-size:13.5px">往这本笔记里添加</b>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px">'+
    [['✏️','手写拍照'],['⌨️','写点文字'],['🖼','截图剪藏'],['🔗','粘贴链接']].map(o=>
      '<div onclick="toast(\''+o[1]+'：已进入添加流程\')" style="background:#FAFBFC;border:1.2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer">'+
      '<div style="font-size:18px">'+o[0]+'</div>'+
      '<div style="font-size:12.5px;font-weight:700;margin-top:5px">'+o[1]+'</div></div>').join('')+
    '</div></div>';
  openSub('笔记本', h);
}

function openNBEntry(k, eid){
  const e = (NB_ENTRIES[k]||[]).find(x=>x.id===eid); if(!e) return;
  const sb = SRC_BADGE[e.src];
  openSheet(
    '<div class="row" style="margin-bottom:7px">'+
    '<span class="tag" style="background:'+sb.bg+';color:'+sb.c+'">'+sb.ico+' 来自'+sb.n+'</span>'+
    '<span class="tag tag-note">'+(e.kind==='text'?'⌨️ 文字':e.kind==='hand'?'✏️ 手写':'🖼 截图')+'</span></div>'+
    '<h3>'+e.title+'</h3><p class="desc">'+e.time+' · 已萃取 '+e.pts+' 个知识点</p>'+
    (e.cap?'<div style="background:#FAFBFC;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.75;color:var(--t1);margin-bottom:12px"><b style="color:var(--t3);font-size:10px">我当时的备注</b><br>'+e.cap+'</div>':'')+
    (e.body?'<div style="background:#FAFBFC;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.8;color:var(--t1);margin-bottom:12px">'+e.body+'</div>':'')+
    (e.note?'<div class="hint" style="margin-bottom:14px">'+e.note+'<br><span style="color:var(--t3)">截图内容同样要与权威文献核对：一致才进入学习计划，矛盾则冻结待你裁决。</span></div>':'')+
    '<div style="display:flex;gap:9px">'+
    '<button class="btn line" onclick="closeSheet();toast(\'已打开原始截图\')">看原始截图</button>'+
    '<button class="btn ghost" style="flex:0 0 96px" onclick="closeSheet();openBadCase()">标记有误</button></div>'
  );
}
</script>

      { id:'p21', page:'P2',

      { id:'p321b', page:'P4', hit:'d2', formula:'Attention(Q, K, V) = softmax( QKᵀ / √dk ) V',

/* 把目标元素滚到「吸顶工具条正下方」；offset 用工具条实测高度，避免被遮住 */
function scrollToEl(el, smooth, extra){
  const body = curBody();
  if(!body || !el || !el.getBoundingClientRect || !body.getBoundingClientRect) return false;
  const bar = subQ('#docBar');
  const off = (bar && bar.offsetHeight ? bar.offsetHeight : 96) + (extra||14);
  const delta = el.getBoundingClientRect().top - body.getBoundingClientRect().top - off;
  const top = Math.max(0, body.scrollTop + delta);
  if(smooth && body.scrollTo) body.scrollTo({top:top, behavior:'smooth'});
  else body.scrollTop = top;
  return true;
}

function askAI(q){
  const fid = CHAT.fid;
  CHAT.msgs.push({r:'me', t:q});

    if(hit) CHAT.msgs.push({r:'ai', t:hit.a, cite:hit.cite, src:hit.src});
    else CHAT.msgs.push({r:'ai',
      t:'这个问题在「'+F(fid).name+'」现有的资料里<b>没有直接依据</b>。<br><br>我不会替你编一个答案。两个选择：①我按你已有的知识点给一个推测（会明确标注"推测"）；②我去内置文献库找一篇能回答它的文献加入你的队列。',
      cite:'无匹配来源 · 已如实告知', src:null, nohit:true});
    chatRedraw();

      h += '<div style="align-self:flex-start;max-width:88%">'+
        '<div style="display:flex;gap:8px;align-items:flex-end">'+
        '<div style="flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#14161A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">🤖</div>'+
        '<div style="background:#fff;border-radius:14px 14px 14px 4px;padding:12px 13px;box-shadow:var(--shadow);font-size:13px;line-height:1.8;color:var(--t1)">'+m.t+
        (m.cite?'<div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--t3);line-height:1.6">'+
          (m.nohit?'⚠️ ':'📄 ')+'依据：'+m.cite+'</div>':'')+
        (m.src?'<div style="margin-top:9px"><button class="btn sm line" style="width:100%;text-align:left" onclick="openSrcDoc(\''+m.src+'\')">进入原文位置 ›</button></div>':'')+
        (m.nohit?'<div style="display:flex;gap:7px;margin-top:9px">'+
          '<button class="btn sm ghost" style="flex:1" onclick="toast(\'已生成推测，并标注为不确定\')">给我推测</button>'+
          '<button class="btn sm line" style="flex:1" onclick="closeSub();openLibSub(\''+fid+'\')">去找文献</button></div>':'')+
        '</div></div></div>';
    }
  });
  if(CHAT.typing){
    h += '<div style="align-self:flex-start;display:flex;gap:8px;align-items:center">'+
      '<div style="width:26px;height:26px;border-radius:50%;background:#14161A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">🤖</div>'+
      '<div style="background:#fff;border-radius:14px;padding:11px 15px;box-shadow:var(--shadow);font-size:13px;color:var(--t3)">正在查这个领域的资料…</div></div>';
  }
  h += '</div>';
  /* 快捷问题 */
  h += '<div style="position:sticky;bottom:0;background:var(--bg);padding-top:8px">'+
    '<div style="font-size:10.5px;font-weight:750;color:var(--t3);margin-bottom:7px">试试这些问题</div>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">'+
    (ASK_PRESETS[fid]||ASK_PRESETS._default).map(q=>
      '<span class="chip" style="font-size:11.5px" onclick="askAI(\''+q.replace(/'/g,'')+'\')">'+q+'</span>').join('')+
    '<span class="chip" style="font-size:11.5px" onclick="askAI(\'这个知识点在实际工作里怎么用\')">自己输入…</span>'+
    '</div></div>';
  return h;
}

/* ================== 启动（放在最后，确保所有数据已初始化） ================== */
renderHome(); renderNotes(); renderLib(); renderMe();
</script>
